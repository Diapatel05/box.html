<!DOCTYPE html>
<html>
    <head>
        <title>My Animal Fact File</title>
  <style>

     body {
      background-color: rgb(33, 0, 100);
      font-family: Arial, sans-serif;
    }

    fact-file {
      background-color: lightyellow;
      color: rgb(74, 47, 79);
       width: 290px;
      padding: 30px;
      border: 5px solid forestgreen;
      margin: 35px;
    }

    .animal-name {
      color: white;
      font-size: 25px;
    }

    detail {
      color: darkslategray;
    }

    .cool-fact {
      color: darkorange;
      font-style: italic;
    }
    </style>
    </head>
<body>

<div class ="fact-file">
    <h2 class="animal-name">Snow Leopard</h2>
    <p class="detail">Type: Big Cat</p>
    <p class="detail">Lives in: Mountain ranges of Central Asia</p>
    <p class="detail">Diet: Deer, goats, and wild sheep</p>
    <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>
</div>
</body>
</html>
